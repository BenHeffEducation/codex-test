<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vocabulary Practice Builder</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Helvetica Neue", Arial, sans-serif;
      background: #f6f6f8;
      color: #1f1f1f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 20px;
    }

    .page {
      max-width: 880px;
      margin: 0 auto;
      background: #fff;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 18px 40px rgba(15, 15, 15, 0.08);
    }

    h1 {
      font-size: 28px;
      margin: 0 0 8px;
    }

    p {
      margin: 0 0 24px;
      color: #4a4a4a;
      line-height: 1.5;
    }

    form {
      display: grid;
      gap: 16px;
      margin-bottom: 28px;
    }

    .inputs {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    }

    label {
      font-size: 14px;
      color: #5b5b5b;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    input {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #d9d9df;
      font-size: 15px;
    }

    button {
      justify-self: start;
      padding: 12px 18px;
      border-radius: 999px;
      border: none;
      background: #2f4eea;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 18px rgba(47, 78, 234, 0.2);
    }

    .output {
      display: grid;
      gap: 20px;
    }

    .card {
      border: 1px solid #ececf2;
      border-radius: 14px;
      padding: 18px 20px;
      background: #fafafe;
    }

    .card h2 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    .card ul {
      margin: 8px 0 0;
      padding-left: 18px;
      color: #3d3d3d;
    }

    .placeholder {
      color: #8a8a94;
      font-size: 14px;
      margin: 0;
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>Vocabulary Practice Builder</h1>
    <p>Enter five words and generate quick practice items: cloze sentences, because/but/so stems, and multiple-choice questions.</p>

    <form id="vocab-form">
      <div class="inputs">
        <label>
          Word 1
          <input type="text" name="word" placeholder="e.g., adapt" required />
        </label>
        <label>
          Word 2
          <input type="text" name="word" placeholder="e.g., contrast" required />
        </label>
        <label>
          Word 3
          <input type="text" name="word" placeholder="e.g., summarize" required />
        </label>
        <label>
          Word 4
          <input type="text" name="word" placeholder="e.g., analyze" required />
        </label>
        <label>
          Word 5
          <input type="text" name="word" placeholder="e.g., justify" required />
        </label>
      </div>
      <button type="submit">Generate practice</button>
    </form>

    <section class="output" id="output">
      <p class="placeholder">Your practice items will appear here.</p>
    </section>
  </main>

  <script>
    const form = document.getElementById("vocab-form");
    const output = document.getElementById("output");

    const templates = {
      cloze: (word) => `Cloze sentence: I used the ___ to remember how to use “${word}.”`,
      stem: (word) => `Because/But/So stem: Because ___, I chose to ${word}. / But ___, I decided not to ${word}. / So ___, I will ${word}.`,
      mcq: (word) => [
        `Which option best defines “${word}”?`,
        "A. A helpful action or idea",
        "B. A sound that repeats",
        "C. A place for meetings",
        "D. A number with two digits"
      ]
    };

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const words = Array.from(form.querySelectorAll("input[name='word']"))
        .map((input) => input.value.trim())
        .filter(Boolean);

      output.innerHTML = "";

      if (words.length !== 5) {
        const notice = document.createElement("p");
        notice.className = "placeholder";
        notice.textContent = "Please enter exactly five words to generate the practice items.";
        output.appendChild(notice);
        return;
      }

      words.forEach((word, index) => {
        const card = document.createElement("article");
        card.className = "card";
        card.innerHTML = `
          <h2>Word ${index + 1}: ${word}</h2>
          <p>${templates.cloze(word)}</p>
          <p>${templates.stem(word)}</p>
          <p>${templates.mcq(word)[0]}</p>
          <ul>
            ${templates.mcq(word).slice(1).map((option) => `<li>${option}</li>`).join("")}
          </ul>
        `;
        output.appendChild(card);
      });
    });
  </script>
</body>
</html>
